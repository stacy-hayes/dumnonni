- name: cta
  ingredients:
    - role: headline
      type: Text

    - role: button_text
      type: Text

    - role: button_link
      type: Text

- name: hero
  ingredients:
    - role: headline
      type: Text

    - role: subheadline
      type: Richtext

    - role: button_text
      type: Text

    - role: button_link
      type: Text

    - role: background_image
      type: Picture

- name: image_text
  ingredients:
    - role: image
      type: Picture

    - role: headline
      type: Text

    - role: body
      type: Richtext

- name: rich_text
  ingredients:
    - role: content
      type: Richtext

- name: gallery

  ingredients:
    - role: images
      type: Picture
      settings:
        multiple: true

- name: carousel
  hint: "Displays a sliding carousel of images."
  nestable_elements:
    - carousel_slide

- name: carousel_slide
  hint: "A linked carousel card with an image, title, and description."
  ingredients:
    - role: image
      type: Picture
    - role: linked_page
      type: Page
    - role: title
      type: Text
    - role: description
      type: Text